name: RSI alert

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "--estado"
        required: false
        default: ""

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar RSI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pionex_rsi_alert.py ${{ github.event.inputs.modo }}
